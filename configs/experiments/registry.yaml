    precision: fp32
    stage: static-analysis
    status: planned
    hypothesis: 낮은 비정형 sparsity의 정확도 보존과 dense graph 한계를 확인한다.

  U02:
    name: unstructured-magnitude-30
    family: unstructured
    method: global-magnitude
    cameras: [front]
    pruning: {sparsity: 0.30}
    precision: fp32
    stage: static-analysis
    status: static-analysis-rejected
    hypothesis: 대표 비정형 pruning 대조군으로 실제 가속 여부를 확인한다.
    result:
      decision: rejected
      reason: 30% sparsity에서 dense ONNX 크기·MACs·FLOPs가 감소하지 않았고 정확도가 대폭 하락함.
