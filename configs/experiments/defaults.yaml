version: 1

model:
  architecture: RFDETRSegLarge
  rfdetr_version: 1.8.1

export:
  input_shape: [1, 3, 504, 504]
  batch_size: 1
  onnx_opset: 17
  dynamic_batch: false

tensorrt:
  workspace_mib: 4096
  target_gpu: NVIDIA GeForce RTX 3080
  target_compute_capability: "8.6"

reproducibility:
  random_seed: 42
  front_checkpoint: models/parking_front.pth
  rear_checkpoint: models/parking_rear.pth
  front_calibration_dir: data/calibration/front
  rear_calibration_dir: data/calibration/rear

selection:
  structured_min_parameter_reduction: 0.05
  structured_min_flops_reduction: 0.10
  duplicate_max_parameter_difference: 0.03
  duplicate_max_flops_difference: 0.05

fine_tuning:
  recovery_2to4:
    status: blocked
    dataset_file: roboflow
    dataset_dir: data/training/front
    dataset_source:
      provider: roboflow
      workspace: hmobility-fvu9x
      project: parking_front
      version: 8
      export_format: coco-segmentation
    output_dir: artifacts/experiments/M01/front/recovery
    epochs: 10
    lr: 1.0e-5
    lr_encoder: 1.5e-5
    batch_size: 2
    grad_accum_steps: 8
    effective_batch_size: 16
    weight_decay: 1.0e-4
    lr_scheduler: cosine
    warmup_epochs: 1
    use_ema: true
    ema_decay: 0.993
    early_stopping: true
    early_stopping_patience: 3
    checkpoint_interval: 1
    random_seed: 42
    required_splits: [train, valid]
    required_annotation_file: _annotations.coco.json

  recovery_structured:
    status: ready
    dataset_file: roboflow
    dataset_dir: data/training/front
    dataset_source:
      provider: roboflow
      workspace: hmobility-fvu9x
      project: parking_front
      version: 8
      export_format: coco-segmentation
    output_dir: artifacts/experiments/{experiment_id}/{camera}/recovery
    epochs: 10
    lr: 1.0e-5
    lr_encoder: 1.5e-5
    batch_size: 2
    grad_accum_steps: 8
    effective_batch_size: 16
    weight_decay: 1.0e-4
    lr_scheduler: cosine
    warmup_epochs: 1
    use_ema: true
    ema_decay: 0.993
    early_stopping: true
    early_stopping_patience: 3
    checkpoint_interval: 1
    random_seed: 42
    required_splits: [train, valid]
    required_annotation_file: _annotations.coco.json
