version: 1

model:
  architecture: RFDETRSegLarge
  rfdetr_version: 1.8.1

export:
  input_shape: [1, 3, 504, 504]
  batch_size: 1
  onnx_opset: 17
  dynamic_batch: false

tensorrt:
  workspace_mib: 4096
  target_gpu: desktop-local
  target_compute_capability: detect-at-build-time

reproducibility:
  random_seed: 42
  notebook_min_free_disk_gib: 10
  front_checkpoint: artifacts/training/front-rfdetr-seg-large-v1/checkpoint_best_total.pth
  front_calibration_dir: data/training/front_session_split_v1/train
  calibration_image_count: 128
  calibration_seed: 42

evaluation_protocol:
  dataset_role: fixed_repeated_benchmark
  dataset_dir: data/training/front_session_split_v1/test
  expected_images: 437
  coco_ap_confidence_threshold: 0.001
  semantic_miou_confidence_threshold: 0.25
  coco_iou_thresholds: "0.50:0.05:0.95"
  coco_max_detections_per_image: 100
  onnx_dataset_parity_max_absolute_delta: 0.005
  graph_equivalence:
    samples: 10
    sample_seed: 42
    confidence_threshold: 0.05
    boxes_max_absolute_error: 0.0001
    scores_max_absolute_error: 0.0005
    masks_max_absolute_error: 0.05
    masks_mean_absolute_error: 0.0005
    active_membership_agreement: 1.0
    active_class_agreement: 1.0
    active_mask_binary_agreement: 0.999
  latency:
    batch_size: 1
    benchmark_repetitions: 3
    warmup_runs: 20
    measured_runs: 200
    sampled_images: 32
    sample_seed: 42
    postprocess_confidence_threshold: 0.25
    primary_statistic: median_ms
    secondary_statistics: [mean_ms, p95_ms, p99_ms, iqr_ms, coefficient_of_variation, replicate_median_ci95]
    replicate_median_cv_warning_threshold: 0.05
    confidence_level: 0.95
    scope: end_to_end_in_memory_image
    disk_image_decode_included: false
    load_stabilization:
      enabled: true
      required_platform_profile: performance
      required_cpu_energy_performance_preference: performance
      sample_interval_seconds: 1.0
      required_consecutive_samples: 5
      timeout_seconds: 300
      max_cpu_utilization_percent: 20.0
      max_gpu_utilization_percent: 40.0
      max_gpu_memory_utilization_percent: 25.0
      max_gpu_temperature_c: 65.0
      max_cpu_utilization_span_percent: 10.0
      max_gpu_utilization_span_percent: 8.0
      max_gpu_memory_utilization_span_percent: 5.0
      max_gpu_temperature_span_c: 3.0
      max_cpu_utilization_delta_from_reference_percent: 10.0
      max_gpu_utilization_delta_from_reference_percent: 8.0
      max_gpu_memory_utilization_delta_from_reference_percent: 5.0
      max_gpu_temperature_delta_from_reference_c: 5.0
      require_ac_power: true
      recorded_sample_limit: 30

workflow:
  stage_1_static:
    scope: [artifact-validity, graph-structure, artifact-size, dense-macs-flops, precision-evidence, sparsity-evidence, deterministic-build-recipe]
    excluded_metrics: [accuracy, latency, fps, gpu-memory]
    output: results/stage1-static-evaluation.json
  stage_2_notebook:
    scope: [tensorrt-build, bbox-ap, bbox-ap50-ap75, bbox-size-stratified-ap, bbox-ar100, mask-ap, mask-ap50-ap75, mask-size-stratified-ap, mask-ar100, per-class-ap, semantic-miou, per-class-iou, repeated-latency, tail-latency, fps, gpu-memory, engine-size]
    input_rule: stage1-static-evaluation.stage2_notebook_eligible
  stage_3_pareto:
    starts_after: all-stage2-eligible-candidates-have-terminal-results
    objectives:
      maximize: [mask_ap]
      minimize: [median_ms, engine_size_bytes]
    secondary_reported_metrics: [bbox_ap, semantic_miou, p95_ms, gpu_peak_allocated_bytes]

# These are project-specific engineering acceptance gates, not universal
# statistical significance thresholds. They were fixed before TensorRT accuracy
# evaluation and are consumed directly by the desktop queue and audit scripts.
selection:
  deployment_realtime:
    target_fps: 30
    median_latency_max_ms: 33.333333333333336
    rule: median_latency_max
    p95_policy:
      role: diagnostic_warning_only
      warning_when: above_median_latency_budget
      hard_gate: false
  # Stage 1 is static only. Accuracy and runtime gates below are Stage-2 gates.
  # A graph-transform candidate must produce a meaningful deployment-side
  # reduction in at least one dense artifact metric. Precision candidates use
  # Q/DQ/precision evidence or a deterministic TensorRT build recipe instead.
  first_stage_efficiency:
    rule: any
    onnx_size_min_relative_reduction: 0.05
    onnx_nodes_min_relative_reduction: 0.05
    dense_macs_min_relative_reduction: 0.05
  accuracy_vs_baseline:
    bbox_ap_max_absolute_drop: 0.01
    mask_ap_max_absolute_drop: 0.01
    semantic_miou_max_absolute_drop: 0.02
  structured_comparison:
    candidate: S02
    reference: S01
    bbox_ap_max_absolute_drop: 0.005
    mask_ap_max_absolute_drop: 0.005
    semantic_miou_max_absolute_drop: 0.01
    median_latency_min_relative_reduction: 0.05
  int8_vs_fp16:
    candidate: B03
    accuracy_reference: B01
    latency_reference: B02
    bbox_ap_max_absolute_drop: 0.01
    mask_ap_max_absolute_drop: 0.01
    median_latency_min_relative_reduction: 0.10
  sparse_vs_dense_control:
    candidate: M02
    accuracy_reference: M01
    latency_reference: M01
    require_sparse_tactic_evidence: true
    bbox_ap_max_absolute_drop: 0.005
    mask_ap_max_absolute_drop: 0.005
    median_latency_min_relative_reduction: 0.10

fine_tuning:
  recovery_2to4:
    status: ready
    dataset_file: roboflow
    dataset_dir: data/training/front_session_split_v1
    dataset_source:
      provider: roboflow
      workspace: hmobility-fvu9x
      project: parking_front
      version: 9
      export_format: coco-segmentation
    output_dir: artifacts/experiments/M01/front/recovery
    epochs: 10
    lr: 1.0e-5
    lr_encoder: 1.5e-5
    batch_size: 2
    grad_accum_steps: 8
    effective_batch_size: 16
    weight_decay: 1.0e-4
    lr_scheduler: cosine
    warmup_epochs: 1
    use_ema: true
    ema_decay: 0.993
    early_stopping: true
    early_stopping_patience: 3
    checkpoint_interval: 1
    random_seed: 42
    required_splits: [train, valid]
    required_annotation_file: _annotations.coco.json

  recovery_2to4_extended:
    status: ready
    dataset_file: roboflow
    dataset_dir: data/training/front_session_split_v1
    dataset_source:
      provider: roboflow
      workspace: hmobility-fvu9x
      project: parking_front
      version: 9
      export_format: coco-segmentation
    output_dir: artifacts/experiments/M03/front/recovery
    epochs: 20
    lr: 1.0e-5
    lr_encoder: 1.5e-5
    batch_size: 2
    grad_accum_steps: 8
    effective_batch_size: 16
    weight_decay: 1.0e-4
    lr_scheduler: cosine
    warmup_epochs: 1
    use_ema: true
    ema_decay: 0.993
    early_stopping: false
    early_stopping_patience: 3
    checkpoint_interval: 1
    random_seed: 42
    required_splits: [train, valid]
    required_annotation_file: _annotations.coco.json

  recovery_structured:
    status: ready
    dataset_file: roboflow
    dataset_dir: data/training/front_session_split_v1
    dataset_source:
      provider: roboflow
      workspace: hmobility-fvu9x
      project: parking_front
      version: 9
      export_format: coco-segmentation
    output_dir: artifacts/experiments/{experiment_id}/{camera}/recovery
    epochs: 10
    lr: 1.0e-5
    lr_encoder: 1.5e-5
    batch_size: 2
    grad_accum_steps: 8
    effective_batch_size: 16
    weight_decay: 1.0e-4
    lr_scheduler: cosine
    warmup_epochs: 1
    use_ema: true
    ema_decay: 0.993
    early_stopping: true
    early_stopping_patience: 3
    checkpoint_interval: 1
    random_seed: 42
    required_splits: [train, valid]
    required_annotation_file: _annotations.coco.json
