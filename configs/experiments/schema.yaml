version: 1

required_experiment_fields:
  - name
  - family
  - method
  - cameras
  - precision
  - stage
  - status
  - hypothesis

allowed_cameras: [front, rear]
allowed_precisions: [fp32, fp16, int8]
allowed_statuses:
  - planned
  - blocked
  - checkpoint-created
  - static-analysis-passed
  - static-analysis-rejected
  - onnx-exported
  - engine-built
  - build-failed
  - ready-for-evaluation
  - selected-for-rear
  - delivered

metadata_required_fields:
  - experiment_id
  - camera
  - source_checkpoint
  - source_checkpoint_sha256
  - method
  - precision
  - input_shape
  - batch_size
  - classes
  - onnx_opset
  - artifacts
  - status
  - created_at_utc
